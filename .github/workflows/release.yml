name: Tag validation

# tag 只触发源码验证与短期预览 artifact；CI 未配置 Developer ID 私钥与
# notarytool 凭据，因此绝不创建公开 Release。正式发布见 RELEASE-STEPS.md。

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe 需要完整历史与 tag
      - name: 构建 + 自检
        run: |
          ./build.sh
          .build/miremote --self-test
      - name: 组装 ad-hoc 预览包
        run: scripts/package.sh --unsigned
      - name: 生成 ad-hoc 预览 DMG
        run: scripts/make-dmg.sh --unsigned
      - name: 保存短期预览 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoKey-${{ github.ref_name }}-unsigned-preview
          path: |
            dist/*-unsigned.dmg
            dist/*-unsigned.zip
          retention-days: 7
